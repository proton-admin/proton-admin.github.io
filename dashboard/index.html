<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <div class="title-row">

        <img src="logo.jpg" width="300" id="logo" alt="Logo">

    </div>


    <!-- ========================= -->
    <!-- Controls -->
    <!-- ========================= -->

    <div class="card">

        <!-- Dataset Switch -->

        <div id="datasetSwitcher" class="dataset-switch">
            <!-- Generated by JS -->
        </div>

        <!-- Filters -->

        <div class="filters">

            <div>

                <label for="filterDropdown">View</label>

                <select id="filterDropdown">
                </select>

            </div>

        </div>


        <!-- Search -->

        <div class="search-container">

            <label for="searchBox">Search</label>

            <input
                id="searchBox"
                type="text"
                placeholder="Search all columns...">

        </div>

    </div>


    <!-- ========================= -->
    <!-- Summary Table -->
    <!-- ========================= -->

    <div class="card">

        <h2 id="card-title">Summary</h2>

        <table>

            <thead>

                <tr>

                    <th>Category</th>
                    <th>Count</th>

                </tr>

            </thead>

            <tbody id="countTable">

            </tbody>

        </table>

    </div>

    <!-- ========================= -->
    <!-- Chart -->
    <!-- ========================= -->

    <div class="card">

        <canvas id="chart"></canvas>

    </div>


    <!-- ========================= -->
    <!-- Raw Data -->
    <!-- ========================= -->

    <!-- <div class="card">

        <h2 id="card-title">Raw Data</h2>

        <div class="table-container">

            <table id="rawTable">

            </table>

        </div>

    </div> -->

</div>

<script src="script.js"></script>

</body>

</html>
